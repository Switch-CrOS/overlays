base_config: &base_config
  name: "{{$device-name}}"
  identity: &identity_common
    platform-name: "{{$platform-name}}"
    smbios-name-match: "{{$smbios-name}}"
    sku-id: "{{$sku-id}}"
  firmware:
    no-firmware: True

chromeos:
  devices:
    - $device-name: "deltaur360"
      $platform-name: "Drallion"
      $smbios-name: "Deltaur"
      skus:
        - $sku-id: 1
          config: *base_config
        - $sku-id: 3
          config: *base_config
    - $device-name: "deltaur"
      $platform-name: "Drallion"
      $smbios-name: "Deltaur"
      skus:
        - $sku-id: 2
          config: *base_config
        - $sku-id: 4
          config: *base_config
    - $device-name: "unprovisioned_deltaur"
      $platform-name: "Drallion"
      $smbios-name: "Deltaur"
      skus:
        - $sku-id: 255
          config: *base_config
    - $device-name: "deltan"
      $platform-name: "Sarien"
      $smbios-name: "Deltan"
      skus:
        - $sku-id: 1
          config: *base_config
        - $sku-id: 2
          config: *base_config
    - $device-name: "unprovisioned_deltan"
      $platform-name: "Sarien"
      $smbios-name: "Deltan"
      skus:
        - $sku-id: 255
          config: *base_config
