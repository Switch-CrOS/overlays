base_config: &base_config
  name: "{{$device-name}}"
  identity: &identity_common
    platform-name: "Deltaur"
    smbios-name-match: "{{$fw-name}}"
    sku-id: "{{$sku-id}}"
  firmware:
    no-firmware: True

chromeos:
  devices:
    - $device-name: "deltaur"
      $fw-name: "Deltaur"
      skus:
        - $sku-id: 1
          config: *base_config
    - $device-name: "unprovisioned_deltaur"
      skus:
        - $sku-id: 255
          $fw-name: "deltaur"
          config: *base_config
