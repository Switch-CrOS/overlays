unprovisioned-config: &unprovisioned_config
  name: "{{$device-name}}"
  identity: &unprovisioned_identity
    platform-name: "dedede"
    smbios-name-match: "{{$fw-name}}"
    sku-id: "{{$sku-id-val}}"
  firmware:
    no-firmware: True

device-config: &device_config
  <<: *unprovisioned_config

chromeos:
  devices:
    - $device-name: "waddledoo"
      $fw-name: "Waddledoo"
      # 32-bit value for unprovisioned.
      # This unprovisioned ID is overwritten in factory. A device cannot leave
      # the factory with an unprovisioned id.
      skus:
        - $sku-id-val: 0xffffffff
          config: *unprovisioned_config
