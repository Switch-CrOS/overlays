amp_calibrations:
  boot_time_calibration_enabled: true
  dsm_param: "/lib/firmware/dsm_param.bin"
  dsm_param_read_ctrl: "SMART_AMP1.0 Smart_amp Model_Get_params"
  dsm_param_write_ctrl: "SMART_AMP1.0 Smart_amp Model"
  temp_ctrl: ["Left ADC TEMP", "Right ADC TEMP"]
  safe_mode_volume: 138
  normal_mode_volume: 153
  rdc_ranges:
    -
      lower: 6.8
      upper: 9.2
    -
      lower: 6.8
      upper: 9.2
