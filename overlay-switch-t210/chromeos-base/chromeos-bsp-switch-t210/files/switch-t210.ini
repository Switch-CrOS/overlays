[ChromiumOS]
l4t=1
boot_prefixes=/switchroot/chromiumos/
id=CHROMEOS
rootdev=mmcblk0p3
rootfstype=ext2
auto_rootdev_disable=1
rootlabel_retries=0
r2p_action=self
icon=switchroot/chromiumos/icon_chromiumos_hue.bmp
logopath=switchroot/chromiumos/bootlogo_chromiumos.bmp
bootargs_extra=console=tty0 loglevel=7 printk.time=1 ignore_loglevel cros_debug vt.global_cursor_default=0 security=selinux enforcing=0 audit=0
