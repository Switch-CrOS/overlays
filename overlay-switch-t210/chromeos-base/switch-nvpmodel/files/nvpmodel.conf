description     "Apply the NVIDIA nvpmodel power profile (Tegra X1 / Switch)"
author          "chromium-os-dev@chromium.org"

# boot-services starts on `stopped startup`, i.e. after chromeos_startup has
# mounted the stateful partition -- nvpmodel persists its state under
# /var/lib/nvpmodel.  The cpufreq sysfs nvpmodel writes is up far earlier.
start on started boot-services
task

# Short-lived one-shot; mildly protect it from the OOM killer while it runs.
oom score -100

# Create /var/lib/nvpmodel (nvpmodel's state dir) the sanctioned way instead
# of mkdir in the script.
tmpfiles /usr/lib/tmpfiles.d/nvpmodel.conf

# Power-model ID applied at boot.  0 = Console (1785 MHz CPU / 768 MHz GPU),
# the conservative Switchroot default.  The dock-handler will switch modes
# dynamically (dock/undock, low battery) in a later change.
env NVPMODEL_DEFAULT_MODE=0

script
  # The same image runs on Erista (Tegra210) and Mariko (Tegra210B01); U-Boot
  # selects the DTB from the SKU, we select the matching power-model config.
  # Pass it explicitly with -f rather than relying on the stock
  # /etc/nvpmodel.conf symlink, since the rootfs /etc is read-only.
  compatible="$(tr -d '\0' < /proc/device-tree/compatible 2>/dev/null || true)"
  case "${compatible}" in
    *tegra210b01*) conf="/etc/nvpmodel/nvpmodel_t210b01.conf" ;;
    *)             conf="/etc/nvpmodel/nvpmodel_t210.conf" ;;
  esac

  # /var/lib/nvpmodel (where nvpmodel persists state) is created by the
  # tmpfiles stanza above.
  #
  # The GPU (gpu.0) finishes probing a few seconds into boot, after this job
  # starts -- nvpmodel needs the GPU devfreq/power nodes to apply a power
  # model, so applying once at boot-services races and fails.  Retry until it
  # succeeds (the first success is as soon as the nodes are ready).  Errors
  # are squelched during retries to avoid log spam.
  i=0
  applied=0
  while [ "${i}" -lt 30 ]; do
    if nvpmodel -f "${conf}" -m "${NVPMODEL_DEFAULT_MODE}" >/dev/null 2>&1; then
      applied=1
      break
    fi
    i=$((i + 1))
    sleep 1
  done
  if [ "${applied}" = 1 ]; then
    logger -t nvpmodel "applied mode ${NVPMODEL_DEFAULT_MODE} after ${i}s"
  else
    logger -t nvpmodel "could not apply mode ${NVPMODEL_DEFAULT_MODE} (${conf}) within 30s"
  fi

  # --- low-risk perf/power sysfs tweaks (the CrOS-relevant subset of nv.sh) ---

  # Larger read-ahead helps sequential throughput off the SD/eMMC.
  for q in /sys/block/mmcblk0/queue/read_ahead_kb \
           /sys/block/mmcblk1/queue/read_ahead_kb; do
    [ -w "${q}" ] && echo 1024 > "${q}"
  done

  # Allow the deepest CPU idle state while idle (power saving).
  for p in /sys/module/cpuidle/parameters/power_down_in_idle \
           /sys/module/cpuidle/parameters/lp2_in_idle; do
    [ -w "${p}" ] && echo Y > "${p}"
  done

  # If schedutil is the active governor, make it ramp to max instantly (better
  # interactive responsiveness).  We deliberately do NOT force-switch the
  # governor, to avoid fighting powerd's CPU policy.
  gov="$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true)"
  if [ "${gov}" = "schedutil" ]; then
    su="/sys/devices/system/cpu/cpufreq/schedutil"
    [ -w "${su}/up_rate_limit_us" ]   && echo 0   > "${su}/up_rate_limit_us"
    [ -w "${su}/down_rate_limit_us" ] && echo 500 > "${su}/down_rate_limit_us"
  fi
end script
