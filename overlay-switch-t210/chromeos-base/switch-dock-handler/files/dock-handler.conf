description     "Nintendo Switch dock display handler (internal panel <-> dock HDMI)"
author          "chromium-os-dev@chromium.org"

# Re-apply display routing whenever the dock state changes (the udev rule emits
# switch-dock-changed) and once when the UI/X server first comes up -- the
# latter handles booting while already docked.
start on switch-dock-changed or started ui
task

# Short one-shot; mildly protect from the OOM killer while it runs.
oom score -100

script
  # The Switch bring-up Xorg runs as :0 and allows local root connections with
  # no auth (verified), so DISPLAY alone is enough for xrandr here.
  DISPLAY=:0
  export DISPLAY

  # Kernel 'switch' class: dp state 1 = dock DisplayPort connected.
  state=0
  [ -r /sys/class/switch/dp/state ] && state="$(cat /sys/class/switch/dp/state)"

  if [ "${state}" = "1" ]; then
    # Docked: drive the dock's HDMI (DP-0).  Match Ash's fixed 1280x720
    # framebuffer (the TV upscales); fall back to the TV's preferred mode if
    # 720p isn't offered.
    xrandr --output DSI-0 --off --output DP-0 --mode 1280x720 --primary 2>/dev/null ||
      xrandr --output DSI-0 --off --output DP-0 --auto --primary ||
      logger -t dock-handler "failed to enable DP-0 output"
  else
    # Undocked (or no dock): internal panel (DSI-0).
    xrandr --output DP-0 --off --output DSI-0 --auto --primary 2>/dev/null ||
      logger -t dock-handler "failed to restore DSI-0 output"
  fi
end script
