description     "Nintendo Switch dock display handler (internal panel <-> dock HDMI)"
author          "chromium-os-dev@chromium.org"

# Re-apply display routing whenever the dock state changes (the udev rule emits
# switch-dock-changed), when the UI/X server first comes up (booted-while-docked),
# and on user-session start -- Ash re-initializes its display to the configured
# --ash-host-window-bounds (720p) at login, which would otherwise drop us back
# to a 720p window while docked.
start on switch-dock-changed or started ui or start-user-session
task

# Short one-shot; mildly protect from the OOM killer while it runs.
oom score -100

script
  # The Switch bring-up Xorg runs as :0 and allows local root connections with
  # no auth (verified), so DISPLAY alone is enough for xrandr here.
  DISPLAY=:0
  export DISPLAY

  # Kernel 'switch' class: dp state 1 = dock DisplayPort connected.
  state=0
  [ -r /sys/class/switch/dp/state ] && state="$(cat /sys/class/switch/dp/state)"

  # dp state 1 = docked (drive the dock HDMI, DP-0); else internal panel DSI-0.
  if [ "${state}" = "1" ]; then
    on="DP-0"; off="DSI-0"
  else
    on="DSI-0"; off="DP-0"
  fi

  # Preferred (native) mode of the active output.  xrandr reports the '+'
  # (preferred) mode whether the output is currently on or off, so we can read
  # it up front and switch in a single command rather than --auto then re-read.
  # Adapts to whatever the panel/TV reports (720p/1080p/4K/aftermarket panel).
  mode="$(xrandr -q | awk -v o="${on}" \
    '$1==o {f=1; next} /^[^ ]/ {f=0} f && /\+/ {print $1; exit}')"

  if [ -n "${mode}" ]; then
    # One shot: size the screen, drop the other output, bring the active output
    # up at its native mode -- minimizes the wrong-size transition.
    xrandr --fb "${mode}" --output "${off}" --off \
           --output "${on}" --mode "${mode}" --primary 2>/dev/null || true
  else
    # No '+' advertised; let xrandr pick, then read what it chose.
    xrandr --output "${off}" --off --output "${on}" --auto --primary 2>/dev/null || true
    mode="$(xrandr -q | awk -v o="${on}" \
      '$1==o {f=1; next} /^[^ ]/ {f=0} f && /\*/ {print $1; exit}')"
    [ -n "${mode}" ] && { xrandr --fb "${mode}" 2>/dev/null || true; }
  fi

  if [ -z "${mode}" ]; then
    logger -t dock-handler "could not determine ${on} mode"
    exit 0
  fi
  w="${mode%x*}"; h="${mode#*x}"

  # Resize the Ash host window to match; with the change_display_upon_host_resize
  # chrome patch this relayouts Ash's display.  Poll at 0.2s so the wrong-size
  # window is a brief blip:
  #  * at boot the Ash window may not exist yet -> retry until it appears,
  #  * at login Ash re-resets to 720p a beat after the event -> keep re-applying.
  # Each call also nudges the pointer to wake Ash's deferred relayout.
  i=0
  while [ "${i}" -lt 150 ]; do
    ash-set-display-size "${w}" "${h}" && break
    i=$((i + 1))
    sleep 0.2
  done
  if [ "${i}" -ge 150 ]; then
    logger -t dock-handler "ash-set-display-size ${mode} never took (no window?)"
  else
    j=0
    while [ "${j}" -lt 15 ]; do
      sleep 0.2
      ash-set-display-size "${w}" "${h}" 2>/dev/null || true
      j=$((j + 1))
    done
  fi
end script
