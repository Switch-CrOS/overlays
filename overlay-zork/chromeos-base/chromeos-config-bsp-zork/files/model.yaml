common-config: &common_config
  name: "{{$device-name}}"
  test-label: "{{$device-name}}"
  identity:
    platform-name: "Zork"
    smbios-name-match: "{{$fw-name}}"
    sku-id: "{{$sku-id}}"
  firmware-signing:
    key-id: "{{$key-id}}"
    signature-id: "{{$device-name}}"
  firmware: &firmware_common
    bcs-overlay: "overlay-zork-private"
    build-targets:
      coreboot: "{{$fw-build-name}}"
      ec: "{{$fw-build-name}}"
      depthcharge: "zork"
      libpayload: "zork"
    image-name: "{{$fw-build-name}}"
  audio:
    main:
      $audio-config: "{{$device-name}}"
      $cras_root: "/etc/cras"
      $ucm_root: "/usr/share/alsa/ucm"
      $card: "acp3xalc5682m98357"

      $ucm_extra_suffix: ""
      $sub_cras_config: ""
      cras-config-dir: "{{$audio-config}}{{$sub_cras_config}}"
      ucm-suffix: "{{$num-mic-locations}}mic{{$ucm_extra_suffix}}"
      files:
        - source: "cras-config/{{cras-config-dir}}/{{$card}}"
          destination: "{{$cras_root}}/{{cras-config-dir}}/{{$card}}"
        - source: "cras-config/{{cras-config-dir}}/dsp.ini"
          destination: "{{$cras_root}}/{{cras-config-dir}}/dsp.ini"
        - source: "ucm-config/{{$card}}.{{$num-mic-locations}}mic/HiFi.conf"
          destination: "{{$ucm_root}}/{{$card}}.{{ucm-suffix}}/HiFi.conf"
        - source: "ucm-config/{{$card}}.{{$num-mic-locations}}mic/{{$card}}.{{$num-mic-locations}}mic.conf"
          destination: "{{$ucm_root}}/{{$card}}.{{ucm-suffix}}/{{$card}}.{{$num-mic-locations}}mic.conf"
  camera:
    $camera-count: 1
    count: "{{$camera-count}}"

trembyle-config: &trembyle_config
  <<: *common_config
  $fw-name: "{{$device-name}}"
  $fw-build-name: "{{$device-name}}"
  $key-id: "TREMBYLE"

morphius-config: &morphius_config
  <<: *common_config
  $fw-name: "{{$device-name}}"
  $fw-build-name: "{{$device-name}}"
  $key-id: "MORPHIUS"

ezkinil-config: &ezkinil_config
  <<: *common_config
  $fw-name: "{{$device-name}}"
  $fw-build-name: "{{$device-name}}"
  $key-id: "EZKINIL"

dalboz-config: &dalboz_config
  <<: *common_config
  $fw-name: "{{$device-name}}"
  $fw-build-name: "{{$device-name}}"
  $key-id: "DALBOZ"

chromeos:
  devices:
    - $device-name: "trembyle"
      $num-mic-locations: 1
      skus:
        - $sku-id: 0x7fffffff
          config: *trembyle_config
        # proto1 sku1
        - $sku-id: 0x0002a063
          config: *trembyle_config
        # proto1 sku1.1
        - $sku-id: 0x0003a1fb
          config: *trembyle_config
        # proto1 sku2
        - $sku-id: 0x0006a061
          config: *trembyle_config
        # sku2
        - $sku-id: 0x5a000006
          config: *trembyle_config
        # sku3
        - $sku-id: 0x5a000007
          config: *trembyle_config
        # sku4
        - $sku-id: 0x5a000008
          config: *trembyle_config
    - $device-name: "morphius"
      $num-mic-locations: 2
      $camera-count: 2
      skus:
        - $sku-id: 0x7fffffff
          config: *morphius_config
        - $sku-id: 0x5a000010
          config: *morphius_config
        - $sku-id: 0x5a000011
          config: *morphius_config
        - $sku-id: 0x5a000012
          config: *morphius_config
        - $sku-id: 0x5a000013
          config: *morphius_config
        - $sku-id: 0x5a000014
          config: *morphius_config
        - $sku-id: 0x5a000015
          config: *morphius_config
        - $sku-id: 0x5a000016
          config: *morphius_config
        - $sku-id: 0x5a000017
          config: *morphius_config
        - $sku-id: 0x5a000018
          config: *morphius_config
    - $device-name: "ezkinil"
      $num-mic-locations: 2
      $camera-count: 2
      skus:
        - $sku-id: 0x7fffffff
          config: *ezkinil_config
        - $sku-id: 0x5A020001
          config: *ezkinil_config
        - $sku-id: 0x5A020002
          config: *ezkinil_config
        - $sku-id: 0x5A020003
          config: *ezkinil_config
        - $sku-id: 0x5A020004
          config: *ezkinil_config
        - $sku-id: 0x5A020005
          config: *ezkinil_config
        - $sku-id: 0x5A020006
          config: *ezkinil_config
        - $sku-id: 0x5A020007
          config: *ezkinil_config
        - $sku-id: 0x5A020008
          config: *ezkinil_config
        - $sku-id: 0x5A020009
          config: *ezkinil_config
        - $sku-id: 0x5A02000A
          config: *ezkinil_config
        - $sku-id: 0x5A02000B
          config: *ezkinil_config
        - $sku-id: 0x5A02000C
          config: *ezkinil_config
        - $sku-id: 0x5A02000D
          config: *ezkinil_config
        - $sku-id: 0x5A02000E
          config: *ezkinil_config
        - $sku-id: 0x5A02000F
          config: *ezkinil_config
        - $sku-id: 0x5A020010
          config: *ezkinil_config
    - $device-name: "dalboz"
      $num-mic-locations: 2
      $camera-count: 2
      skus:
        - $sku-id: 0x7fffffff
          config: *dalboz_config
        - $sku-id: 0x5A80000A
          config: *dalboz_config
        - $sku-id: 0x5A80000B
          config: *dalboz_config
        - $sku-id: 0x5A80000C
          config: *dalboz_config
        - $sku-id: 0x5A80000D
          config: *dalboz_config
