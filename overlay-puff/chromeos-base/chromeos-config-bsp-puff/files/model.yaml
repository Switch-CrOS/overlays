base-config: &base_config
  name: "{{$device-name}}"
  identity: &identity_common
    platform-name: "Puff"
    smbios-name-match: "{{$fw-name}}"
    sku-id: "{{$sku-id}}"
  firmware:
    no-firmware: True
  test-label: "{{$device-name}}"

chromeos:
  devices:
    - $device-name: "unprovisioned_puff"
      $fw-name: "Puff"
      # 32-bit value for unprovisioned.
      # This unprovisioned ID is overwritten in factory. A device cannot leave
      # the factory with an unprovisioned id.
      skus:
        - $sku-id: 0xffffffff
          config: *base_config
    - $device-name: "puff"
      $fw-name: "Puff"
      skus:
        - $sku-id: 0
          config: *base_config
