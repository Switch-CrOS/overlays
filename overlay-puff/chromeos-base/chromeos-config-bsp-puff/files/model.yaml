base-config: &base_config
  name: "{{$device-name}}"
  identity: &identity_common
    platform-name: "Puff"
    smbios-name-match: "{{$fw-name}}"
    sku-id: "{{$sku-id}}"
  firmware:
    no-firmware: True
  test-label: "{{$device-name}}"
  audio:
    main:
      $cras_root: "/etc/cras"
      $ucm_root: "/usr/share/alsa/ucm"
      # Variables to be overridden by chromeos/devices/... For example,
      # to add a volume curve specific for Kohaku:
      # 1. Add chromeos-base/chromeos-bsp-hatch/files/kohaku/cras-config/card_settings
      # 2. Add chromeos:
      #          devices:
      #            - $device-name: "kohaku"
      #              $cras_card_config: "{{$device-name}}"
      $alsa_card: "sof-sof_rt5682"
      $cras_card_config: "common"
      $cras_dsp_config: "common"
      $sub_cras_config: ""
      $cras-source-config-dir: "cras-config{{$sub_cras_config}}"
      # Variables passed to adhd/init/cras.sh for starting CRAS
      cras-config-dir: "{{$device-name}}{{$sub_cras_config}}"
      files:
        # ALSA module config
        - source: "common/audio/alsa-module-config/alsa-puff.conf"
          destination: "/etc/modprobe.d/alsa-puff.conf"
        # ALSA UCM config
        - source: "common/audio/ucm-config/{{$alsa_card}}/{{$alsa_card}}.conf"
          destination: "{{$ucm_root}}/{{$alsa_card}}/{{$alsa_card}}.conf"
        - source: "common/audio/ucm-config/{{$alsa_card}}/HiFi.conf"
          destination: "{{$ucm_root}}/{{$alsa_card}}/HiFi.conf"
        # CRAS card config (Volume Curve)
        - source: "{{$cras_card_config}}/audio/{{$cras-source-config-dir}}/card_settings"
          destination: "{{$cras_root}}/{{cras-config-dir}}/{{$alsa_card}}"
        # EQ/DRC DSP config
        - source: "{{$cras_dsp_config}}/audio/{{$cras-source-config-dir}}/dsp.ini"
          destination: "{{$cras_root}}/{{cras-config-dir}}/dsp.ini"
        # Board specific settings
        - source: "{{$cras_dsp_config}}/audio/{{$cras-source-config-dir}}/board.ini"
          destination: "{{$cras_root}}/{{cras-config-dir}}/board.ini"
  power:
    suspend-to-idle: "1"

chromeos:
  devices:
    - $device-name: "unprovisioned_puff"
      $fw-name: "Puff"
      # 32-bit value for unprovisioned.
      # This unprovisioned ID is overwritten in factory. A device cannot leave
      # the factory with an unprovisioned id.
      skus:
        - $sku-id: 0x7fffffff
          config: *base_config
    - $device-name: "puff"
      $fw-name: "Puff"
      skus:
        - $sku-id: 0
          config: *base_config
        - $sku-id: 1
          config: *base_config
        - $sku-id: 2
          config: *base_config
