base_config: &base_config
  name: "{{$device-name}}"
  identity: &identity_common
    platform-name: "Hatch"
    smbios-name-match: "{{$fw-name}}"
    sku-id: "{{$sku-id}}"
  firmware:
    no-firmware: True
  firmware-signing: &firmware_signing_common
    key-id: "{{$key-id}}"
    signature-id: "{{$device-name}}"
  power: &power_common
    charging-ports: |
      CROS_USBPD_CHARGER0 LEFT
      CROS_USBPD_CHARGER1 RIGHT
    low-battery-shutdown-percent: "4.0"
    suspend-to-idle: "1"
    touchpad-wakeup: "1"
    has-keyboard-backlight: "1"
    $has-ambient-light-sensor: "1"
    has-ambient-light-sensor: "{{$has-ambient-light-sensor}}"
    $internal-backlight-als-steps: |-
      80.0 55.0 -1 400
      100.0 80.0 100 -1
    internal-backlight-als-steps: "{{$internal-backlight-als-steps}}"
    $internal-backlight-no-als-battery-brightness: "63.0"
    internal-backlight-no-als-battery-brightness: "{{$internal-backlight-no-als-battery-brightness}}"
    disable-dark-resume: "0"

chromeos:
  devices:
    - $device-name: "hatch"
      $fw-name: "Hatch"
      products:
        - $key-id: "HATCH"
      skus:
        - $sku-id: 255 # Unprovisioned
          config: *base_config
        - $sku-id: 1
          config: *base_config
    - $device-name: "unprovisioned_kohaku"
      $internal-backlight-als-steps: |-
        80.0 47.62 -1 400
        100.0 80.0 100 -1
      skus:
        - $sku-id: 255
          $fw-name: "Kohaku"
          $key-id: "HATCH"
          config: *base_config
    - $device-name: "kohaku"
      $fw-name: "Kohaku"
      products:
        - $key-id: "HATCH"
      $internal-backlight-als-steps: |-
        80.0 47.62 -1 400
        100.0 80.0 100 -1
      skus:
        - $sku-id: 1
          config: *base_config
    - $device-name: "unprovisioned_kindred"
      skus:
        - $sku-id: 255
          $fw-name: "Kindred"
          $key-id: "HATCH"
          config: *base_config
    - $device-name: "kled"
      $fw-name: "Kindred"
      products:
        - $key-id: "HATCH"
      skus:
        - $sku-id: 1
          config: *base_config
        - $sku-id: 2
          config: *base_config
        - $sku-id: 3
          config: *base_config
        - $sku-id: 4
          config: *base_config
    - $device-name: "kindred"
      $fw-name: "Kindred"
      products:
        - $key-id: "HATCH"
      skus:
        - $sku-id: 21
          config: *base_config
        - $sku-id: 22
          config: *base_config
        - $sku-id: 23
          config: *base_config
        - $sku-id: 24
          config: *base_config
    - $device-name: "unprovisioned_helios"
      skus:
        - $sku-id: 255
          $fw-name: "Helios"
          $key-id: "HATCH"
          config:
            <<: *base_config
            power:
              <<: *power_common
              $has-ambient-light-sensor: "0"
              $internal-backlight-no-als-battery-brightness: "56.25"
    - $device-name: "helios"
      $fw-name: "Helios"
      products:
        - $key-id: "HATCH"
      skus:
        - $sku-id: 1
          config:
            <<: *base_config
            power:
              <<: *power_common
              $has-ambient-light-sensor: "0"
              $internal-backlight-no-als-battery-brightness: "56.25"
    - $device-name: "unprovisioned_akemi"
      skus:
        - $sku-id: 255
          $fw-name: "Akemi"
          $key-id: "HATCH"
          config: *base_config
    - $device-name: "akemi"
      $fw-name: "Akemi"
      products:
        - $key-id: "HATCH"
      skus:
        - $sku-id: 1
          config: *base_config
        - $sku-id: 2
          config: *base_config
