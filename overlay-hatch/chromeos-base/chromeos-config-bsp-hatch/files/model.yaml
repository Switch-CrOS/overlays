base-config: &base_config
  name: "{{$device-name}}"
  identity: &identity_common
    platform-name: "Hatch"
    smbios-name-match: "{{$fw-name}}"
    sku-id: "{{$sku-id}}"
  firmware:
    no-firmware: True
  test-label: "{{$device-name}}"
  power: &power_common
    charging-ports: |
      CROS_USBPD_CHARGER0 LEFT
      CROS_USBPD_CHARGER1 RIGHT
    low-battery-shutdown-percent: "4.0"
    suspend-to-idle: "1"
    touchpad-wakeup: "1"
    $has-keyboard-backlight: "1"
    has-keyboard-backlight: "{{$has-keyboard-backlight}}"
    $has-ambient-light-sensor: "1"
    has-ambient-light-sensor: "{{$has-ambient-light-sensor}}"
    $internal-backlight-als-steps: |-
      80.0 55.0 -1 400
      100.0 80.0 100 -1
    internal-backlight-als-steps: "{{$internal-backlight-als-steps}}"
    $internal-backlight-no-als-battery-brightness: "63.0"
    internal-backlight-no-als-battery-brightness: "{{$internal-backlight-no-als-battery-brightness}}"
    disable-dark-resume: "0"
    $keyboard-backlight-user-steps: |-
      0.0
      10.0
      20.0
      40.0
      60.0
      100.0
    keyboard-backlight-user-steps: "{{$keyboard-backlight-user-steps}}"

chromeos:
  devices:
    - $device-name: "unprovisioned_hatch"
      skus:
        - $sku-id: 255
          $fw-name: "Hatch"
          config: *base_config
    - $device-name: "hatch"
      $fw-name: "Hatch"
      skus:
        - $sku-id: 1
          config: *base_config

    - $device-name: "unprovisioned_kohaku"
      skus:
        - $sku-id: 255
          $fw-name: "Kohaku"
          config: *base_config
    - $device-name: "kohaku"
      $fw-name: "Kohaku"
      $internal-backlight-als-steps: |-
        80.0 47.62 -1 400
        100.0 80.0 100 -1
      $has-ambient-light-sensor: "2"
      $keyboard-backlight-user-steps: |-
        0.0
        30.0
        31.0
        33.0
        35.0
        38.0
      skus:
        - $sku-id: 1
          config: *base_config
    - $device-name: "unprovisioned_kindred"
      skus:
        - $sku-id: 255
          $fw-name: "Kindred"
          config: *base_config
    - $device-name: "kled"
      $fw-name: "Kindred"
      $has-ambient-light-sensor: "0"
      skus:
        - $sku-id: 1
          config: *base_config
        - $sku-id: 2
          config: *base_config
        - $sku-id: 3
          config: *base_config
        - $sku-id: 4
          config: *base_config
    - $device-name: "kindred"
      $fw-name: "Kindred"
      $has-ambient-light-sensor: "0"
      $has-keyboard-backlight: "0"
      skus:
        - $sku-id: 21
          config: *base_config
        - $sku-id: 22
          config: *base_config
        - $sku-id: 23
          config: *base_config
        - $sku-id: 24
          config: *base_config
    - $device-name: "unprovisioned_helios"
      skus:
        - $sku-id: 255
          $fw-name: "Helios"
          config:
            <<: *base_config
    - $device-name: "helios"
      $fw-name: "Helios"
      skus:
        - $sku-id: 1
          config:
            <<: *base_config
            power:
              <<: *power_common
              $has-ambient-light-sensor: "0"
              $internal-backlight-no-als-battery-brightness: "56.25"
    - $device-name: "unprovisioned_akemi"
      skus:
        - $sku-id: 255
          $fw-name: "Akemi"
          config: *base_config
    - $device-name: "akemi"
      $fw-name: "Akemi"
      skus:
        - $sku-id: 1
          config: *base_config
        - $sku-id: 2
          config: *base_config
    - $device-name: "unprovisioned_dratini"
      skus:
        - $sku-id: 255
          $fw-name: "Dratini"
          config: *base_config
    - $device-name: "dratini"
      $fw-name: "Dratini"
      $has-ambient-light-sensor: "0"
      skus:
        - $sku-id: 1
          $has-keyboard-backlight: 0
          config: *base_config
        - $sku-id: 2
          config: *base_config
        - $sku-id: 3
          config: *base_config
        - $sku-id: 4
          $has-keyboard-backlight: 0
          config: *base_config
    - $device-name: "dragonair"
      $fw-name: "Dratini"
      $has-ambient-light-sensor: "0"
      skus:
        - $sku-id: 21
          $has-keyboard-backlight: 0
          config: *base_config
        - $sku-id: 22
          config: *base_config
