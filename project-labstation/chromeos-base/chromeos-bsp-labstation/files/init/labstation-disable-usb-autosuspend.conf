description     "Disable USB autosuspend on labstations for stability"
author          "chromium-os-dev@chromium.org"

start on starting system-services

# Disable USB autosuspend globally. Under heavy concurrent load (like
# 10 servo deployments), the USB bus can become saturated, and the default
# USB suspend behavior can cause devices or hubs to sleep inappropriately,
# resulting in watchdog timeouts.
script
  echo -1 > /sys/module/usbcore/parameters/autosuspend || true
end script
