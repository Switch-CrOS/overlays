description   "Configure network to open necessary ports for labstation"
author        "chromium-os-dev@chromium.org"

start on started system-services

task
oom score -100   # Short script at startup; don't oom kill

script

  # Port 9100 is used for BOLS service.
  iptables -A INPUT -p tcp --dport 9100 -j ACCEPT

end script
