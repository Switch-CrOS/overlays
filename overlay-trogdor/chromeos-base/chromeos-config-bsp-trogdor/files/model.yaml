base-config: &base_config
  name: "{{$device-name}}"
  identity:
    platform-name: "Trogdor"
    device-tree-compatible-match: "{{$fw-name}}"
    sku-id: "{{$sku-id}}"
  firmware:
    build-targets:
      ec: "trogdor"
    no-firmware: True
  test-label: "{{$device-name}}"
  power: &power_common
    low-battery-shutdown-percent: "4.0"
    $internal-backlight-no-als-brightness: "66.6"
    internal-backlight-no-als-battery-brightness: "{{$internal-backlight-no-als-brightness}}"
    internal-backlight-no-als-ac-brightness: "{{$internal-backlight-no-als-brightness}}"
    disable-dark-resume: "0"
chromeos:
  devices:
    - $device-name: "trogdor"
      $fw-name: "google,trogdor"
      skus:
        - $sku-id: 0
          config: *base_config
        - $sku-id: 1
          config: *base_config
    - $device-name: "lazor"
      $fw-name: "google,lazor"
      skus:
        - $sku-id: 0
          config: *base_config
        - $sku-id: 1
          config: *base_config
