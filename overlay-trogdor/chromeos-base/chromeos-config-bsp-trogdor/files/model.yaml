base-config: &base_config
  name: "{{$device-name}}"
  identity:
    platform-name: "Trogdor"
    device-tree-compatible-match: "google,trogdor"
    sku-id: "{{$sku-id}}"
  firmware:
    no-firmware: True
  test-label: "{{$device-name}}"
chromeos:
  devices:
    - $device-name: "trogdor"
      skus:
        - $sku-id: 0
          config: *base_config
