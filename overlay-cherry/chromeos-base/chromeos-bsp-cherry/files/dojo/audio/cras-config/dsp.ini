[output_source]
library=builtin
label=source
purpose=playback
disable=(not (equal? dsp_name "speaker_eq"))
output_0={src:0}
output_1={src:1}

[output_sink]
library=builtin
label=sink
purpose=playback
input_0={dst:0}
input_1={dst:1}

[eq2]
library=builtin
label=eq2
input_0={src:0}
input_1={src:1}
output_2={dst:0}
output_3={dst:1}
input_4=2       ; highpass
input_5=150     ; freq
input_6=0       ; Q
input_7=0       ; gain
input_8=2       ; highpass
input_9=150     ; freq
input_10=0       ; Q
input_11=0       ; gain

[input_source]
library=builtin
label=source
purpose=capture
disable=(not (equal? dsp_name "dmic_eq"))
output_0={in_src:0}
output_1={in_src:1}

[input_sink]
library=builtin
label=sink
purpose=capture
input_0={in_dst:0}
input_1={in_dst:1}

[in_dcblock]
library=builtin
label=dcblock
input_0={in_src:0}
input_1={in_src:1}
output_2={in_dst:0}
output_3={in_dst:1}
input_4=0.995       ; R - lone filter parameter
