common_config: &common_config
  firmware:
    no-firmware: true
  identity:
    sku-id: "{{$sku-id}}"
    platform-name: "Cherry"
    device-tree-compatible-match: "{{$fw-name}}"
  name: "{{$device-name}}"
  test-label: "{{$device-name}}"

chromeos:
  devices:
    - $device-name: "cherry"
      products:
        - $fw-name: "google,cherry"
      skus:
        - $sku-id: 0
          config:
            <<: *common_config
