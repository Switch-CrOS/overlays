SectionVerb {
	Value {
		FullySpecifiedUCM "1"
	}
	EnableSequence [
		cdev "hw:sofrt5682"
		cset "name='Headphone Jack Switch' off"

		cset "name='STO1 ADC Capture Switch' on"
		cset "name='Left DAI Sel Mux' 0"
		cset "name='Right DAI Sel Mux' 1"
		cset "name='Left Digital Volume' 180"
		cset "name='Right Digital Volume' 180"
		cset "name='Left Boost Clock Phase' 0"
		cset "name='Right Boost Clock Phase' 3"

		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='CBJ Boost Volume' 16"
		cset "name='Stereo1 ADC L1 Mux' 1"
		cset "name='Stereo1 ADC R1 Mux' 1"
		cset "name='Stereo1 ADC L Mux' 0"
		cset "name='Stereo1 ADC MIXL ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC2 Switch' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
	]
	DisableSequence [
	]
}

SectionDevice."Speaker".0 {
	Value {
		PlaybackPCM "hw:sofrt5682,0"
		EchoReferenceDev "Echo Reference"
	}
	EnableSequence [
		cdev "hw:sofrt5682"
		cset "name='Left Spk Switch' on"
		cset "name='Right Spk Switch' on"
	]
	DisableSequence [
		cdev "hw:sofrt5682"
		cset "name='Left Spk Switch' off"
		cset "name='Right Spk Switch' off"
	]
}

SectionDevice."Echo Reference".0 {
	Value {
		CapturePCM "hw:sofrt5682,6"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}

SectionDevice."Headphone".0 {
	Value {
		PlaybackPCM "hw:sofrt5682,1"
		PlaybackMixerElem "DAC1"
		JackDev "sof-rt5682 Headset Jack"
		JackSwitch "2"
	}
	EnableSequence [
		cdev "hw:sofrt5682"
		cset "name='IF1 01 ADC Swap Mux' L/L"
		cset "name='Headphone Jack Switch' on"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"

	]
	DisableSequence [
		cdev "hw:sofrt5682"

		cset "name='Headphone Jack Switch' off"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
	]
}

SectionDevice."Internal Mic".0 {
	Value {
		CapturePCM "hw:sofrt5682,99"
		IntrinsicSensitivity "-2600"
	}
}

SectionDevice."Mic".0 {
	Value {
		CapturePCM "hw:sofrt5682,1"
		CaptureMixerElem "Headset Mic"
		JackDev "sof-rt5682 Headset Jack"
	}
	EnableSequence [
		cdev "hw:sofrt5682"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cdev "hw:sofrt5682"
		cset "name='Headset Mic Switch' off"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 0"
	]
}

