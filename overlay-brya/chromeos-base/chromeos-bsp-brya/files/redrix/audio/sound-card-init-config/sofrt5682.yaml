amp_calibrations:
  boot_time_calibration_enabled: true
  controls:
    -
        dsm_param: "/lib/firmware/dsm_param_L_Google_Redrix.bin"
        rdc_ctrl: "Left DSM Rdc"
        temp_ctrl: "Left DSM Ambient Temp"
        calib_ctrl: "Left DSM Calibration"
        volume_ctrl: "Left Digital Volume"
    -
        dsm_param: "/lib/firmware/dsm_param_R_Google_Redrix.bin"
        rdc_ctrl: "Right DSM Rdc"
        temp_ctrl: "Right DSM Ambient Temp"
        calib_ctrl: "Right DSM Calibration"
        volume_ctrl: "Right Digital Volume"

    -
        dsm_param: "/lib/firmware/dsm_param_tt_L_Google_Redrix.bin"
        rdc_ctrl: "Tweeter Left DSM Rdc"
        temp_ctrl: "Tweeter Left DSM Ambient Temp"
        calib_ctrl: "Tweeter Left DSM Calibration"
        volume_ctrl: "Tweeter Left Digital Volume"
    -
        dsm_param: "/lib/firmware/dsm_param_tt_R_Google_Redrix.bin"
        rdc_ctrl: "Tweeter Right DSM Rdc"
        temp_ctrl: "Tweeter Right DSM Ambient Temp"
        calib_ctrl: "Tweeter Right DSM Calibration"
        volume_ctrl: "Tweeter Right Digital Volume"

