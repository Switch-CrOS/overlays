[output_source]
library=builtin
label=source
purpose=playback
disable=(not (equal? dsp_name "speaker_eq"))
output_0={src:0}
output_1={src:1}
[output_sink]
library=builtin
label=sink
purpose=playback
input_0={dst:0}
input_1={dst:1}

[eq2]
library=builtin
label=eq2
input_0={src:0}
input_1={src:1}
output_2={dst:0}
output_3={dst:1}
input_4=2       ; highpass
input_5=100     ; freq
input_6=0       ; Q
input_7=0       ; gain
input_8=2       ; highpass
input_9=100     ; freq
input_10=0       ; Q
input_11=0       ; gain
input_12=5       ; highshelf
input_13=1200    ; freq
input_14=1       ; Q
input_15=-13     ; gain
input_16=5       ; highshelf
input_17=1200    ; freq
input_18=1       ; Q
input_19=-13     ; gain
input_20=5       ; highshelf
input_21=2200    ; freq
input_22=1       ; Q
input_23=13      ; gain
input_24=5       ; highshelf
input_25=2200    ; freq
input_26=8       ; Q
input_27=13      ; gain
