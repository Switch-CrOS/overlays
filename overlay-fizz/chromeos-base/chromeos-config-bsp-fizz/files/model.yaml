dev-config: &dev_config
  name: "{{$device-name}}"
  test-label: "{{$device-name}}"
  powerd-prefs: "{{$device-name}}"
  identity: &base_ident
    platform-name: "Fizz"
    smbios-name-match: "Fizz"
    sku-id: "{{$sku-id}}"
  firmware:
    no-firmware: True

wl-dev-config: &wl_dev_config
  <<: *dev_config
  identity:
    <<: *base_ident
    whitelabel-tag: "{{$whitelabel-tag}}"

chromeos:
  devices:
    - $device-name: "kench"
      skus:
        - $sku-id: 0
          config: *dev_config
    - $device-name: "teemo"
      skus:
        - $sku-id: 1
          config: *dev_config
        - $sku-id: 6
          config: *dev_config
    - $device-name: "sion"
      skus:
        - $sku-id: 2
          config: *dev_config
    - $device-name: "jax"
      products:
        - $whitelabel-tag: "" # default
        - $whitelabel-tag: "newline"
      skus:
        - $sku-id: 8
          config:
            <<: *wl_dev_config
            thermal:
              dptf-dv: "{{$device-name}}/dptf.dv"
              files:
                - source: "{{dptf-dv}}"
                  destination: "/etc/dptf/{{dptf-dv}}"
    - $device-name: "wukong"
      products:
        - $whitelabel-tag: "" # default
        - $whitelabel-tag: "ctl"
        - $whitelabel-tag: "viewsonic"
        - $whitelabel-tag: "promethean"
        - $whitelabel-tag: "datmedia"
        - $whitelabel-tag: "smarttech"
      skus:
        - $sku-id: 3
          config: *wl_dev_config
        - $sku-id: 4
          config: *wl_dev_config
        - $sku-id: 5
          config: *wl_dev_config
